<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Bright yellow gold</title>
  <desc id="desc">Bright yellow gold material swatch without a prohibition line.</desc>
  <defs>
    <radialGradient id="gold" cx="32%" cy="22%" r="84%">
      <stop stop-color="#fff8a5"/>
      <stop offset=".18" stop-color="#ffd91f"/>
      <stop offset=".46" stop-color="#d89600"/>
      <stop offset=".70" stop-color="#ffe73d"/>
      <stop offset="1" stop-color="#b77600"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <ellipse cx="128" cy="225" rx="86" ry="12" fill="#322000" opacity=".30" filter="url(#shadow)"/>
  <circle cx="128" cy="122" r="100" fill="url(#gold)"/>
  <circle cx="128" cy="122" r="99" fill="none" stroke="#fff4a0" stroke-opacity=".65"/>
  <circle cx="128" cy="122" r="96.5" fill="none" stroke="#6f4000" stroke-opacity=".42"/>
</svg>
