<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Soft gold</title><desc id="desc">Muted satin gold with a refined low-contrast glow.</desc>
  <defs>
    <radialGradient id="gold" cx="34%" cy="24%" r="82%"><stop stop-color="#f7e7b8"/><stop offset=".23" stop-color="#d6b66f"/><stop offset=".48" stop-color="#a48146"/><stop offset=".68" stop-color="#dec68c"/><stop offset=".88" stop-color="#876a3f"/><stop offset="1" stop-color="#c2a263"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#332612" flood-opacity=".36"/></filter>
    <filter id="satin"><feTurbulence type="fractalNoise" baseFrequency=".018 .52" numOctaves="3" seed="23" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feBlend in="SourceGraphic" mode="soft-light"/></filter>
    <clipPath id="disc"><circle cx="128" cy="122" r="100"/></clipPath>
  </defs>
  <circle cx="128" cy="122" r="100" fill="url(#gold)" filter="url(#shadow)"/><g clip-path="url(#disc)" filter="url(#satin)"><circle cx="128" cy="122" r="100" fill="url(#gold)"/><ellipse cx="91" cy="69" rx="70" ry="35" fill="#fff7d6" opacity=".2" transform="rotate(-22 91 69)"/></g>
  <circle cx="128" cy="122" r="99" fill="none" stroke="#f8e8b9" stroke-opacity=".62"/><circle cx="128" cy="122" r="96.5" fill="none" stroke="#6c522e" stroke-opacity=".34"/>
</svg>
